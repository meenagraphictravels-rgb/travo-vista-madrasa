body.theme-olive{--blue:#3f6212;--blue2:#65a30d;--navy:#365314;}
body.theme-darkgreen{--bg:#071a14;--card:#0d241c;--text:#e8f5ef;--muted:#a7c0b5;--border:#234238;--blue:#166534;--blue2:#22c55e;--navy:#052e16;}
body.theme-darkgreen .section,body.theme-darkgreen .card,body.theme-darkgreen .modalBox{background:#0d241c;border-color:#234238;}
body.theme-royal{--blue:#6d28d9;--blue2:#a855f7;--navy:#4c1d95;--bg:#faf7ff;--card:#fff;--text:#24113f;--border:#e9d5ff;}
body.theme-sunset{--blue:#9a3412;--blue2:#ea580c;--navy:#7c2d12;--bg:#fff8f3;--card:#fff;--text:#3b1a0f;--border:#fed7aa;}
body.theme-royal .sidebar{background:linear-gradient(180deg,#4c1d95,#2e1065)}
body.theme-sunset .sidebar{background:linear-gradient(180deg,#9a3412,#431407)}
body.theme-royal .section,body.theme-royal .card,body.theme-royal .modalBox{border-color:#e9d5ff}
body.theme-sunset .section,body.theme-sunset .card,body.theme-sunset .modalBox{border-color:#fed7aa}

/* Mobile Responsive - Travo Vista Madrasa */
/* Mobile Responsive - Fixed Sidebar + Toggle */
.mobileMenuBtn{
  display:none;
}

.mobileSidebarOverlay{
  display:none;
}

@media(max-width:760px){

  body{
    overflow-x:hidden;
  }

  /* Main content full width */
  .main,
  .rtl .main{
    width:100%;
    margin:0;
    padding:12px;
  }

  /* Fixed mobile sidebar */
  .sidebar{
    position:fixed;
    z-index:1000;
    top:0;
    bottom:0;
    left:0;
    width:270px;
    height:100vh;
    max-height:none;
    padding:18px 13px;
    overflow-y:auto;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }

  /* Sidebar open */
  body.mobileSidebarOpen .sidebar{
    transform:translateX(0);
  }

  /* Dark overlay behind sidebar */
  .mobileSidebarOverlay{
    display:block;
    position:fixed;
    z-index:999;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease;
  }

  body.mobileSidebarOpen .mobileSidebarOverlay{
    opacity:1;
    visibility:visible;
  }

  /* Toggle button */
  .mobileMenuBtn{
    display:flex;
    position:fixed;
    z-index:1100;
    top:10px;
    left:10px;
    width:42px;
    height:42px;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:10px;
    background:#064e3b;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
  }

  /* Header */
  .top{
    padding-top:52px;
    align-items:flex-start;
    flex-direction:column;
    gap:12px;
    margin-bottom:14px;
  }

  .top h1{
    font-size:21px;
    line-height:1.3;
  }

  /* User controls */
  .userBadge{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }

  .userBadge button,
  .userBadge select{
    flex:1 1 auto;
  }

  .userBadge .mini{
    width:100%;
    order:-1;
  }

  /* Cards */
  .cards{
    grid-template-columns:1fr;
    gap:10px;
  }

  .card{
    padding:14px;
  }

  .stat{
    font-size:24px;
  }

  /* Forms */
  .grid,
  .info{
    grid-template-columns:1fr;
    gap:10px;
  }

  .section{
    padding:14px;
    border-radius:11px;
  }

  .section h2{
    font-size:16px;
  }

  .field input,
  .field select,
  .field textarea{
    font-size:14px;
  }

  /* Buttons */
  .actions{
    flex-wrap:wrap;
  }

  .actions button{
    flex:1 1 auto;
    min-width:110px;
  }

  /* Search */
  .toolbar{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    width:100%;
    min-width:0;
  }

  /* Tables */
  .tablewrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  .table{
    min-width:max-content;
  }

  .table th,
  .table td{
    padding:8px;
    font-size:12px;
  }

  /* Modal */
  .modal{
    padding:10px;
    align-items:flex-start;
  }

  .modalBox{
    width:100%;
    max-height:94vh;
    padding:15px;
    border-radius:12px;
    margin-top:5px;
  }

  /* Receipt */
  .receipt{
    width:100%;
    padding:15px;
  }

  .receiptHead{
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .receiptGrid{
    grid-template-columns:1fr;
  }

  /* Marksheet */
  .marksheet{
    width:100%;
    padding:12px;
    overflow-x:auto;
  }

  .msTop{
    grid-template-columns:65px 1fr;
  }

  .msLogo img{
    width:58px;
    height:58px;
  }

  .msSchool h1{
    font-size:19px;
  }

  .msTitle{
    grid-column:1 / -1;
  }

  .msStudent{
    grid-template-columns:1fr;
  }

  .msStudent div:nth-child(odd){
    border-right:0;
  }

  .msTable{
    min-width:600px;
  }

  .msSummary{
    grid-template-columns:1fr 1fr;
  }

  .msFooter{
    grid-template-columns:1fr;
    gap:25px;
    margin-top:30px;
  }

  /* Attendance */
  .attendanceMatrix{
    width:100%;
    overflow-x:auto;
  }

  .attendanceMatrix .table{
    min-width:700px;
  }

  /* Themes */
  .themeChoices{
    grid-template-columns:1fr;
  }

  /* Auth */
  .authOverlay{
    padding:12px;
  }

  .authBox{
    width:100%;
    padding:20px;
    border-radius:14px;
  }

  .authBrand h2{
    font-size:20px;
  }

  /* Toast */
  .toast{
    left:10px;
    right:10px;
    bottom:10px;
    text-align:center;
  }
}

@media(max-width:420px){

  .mobileMenuBtn{
    width:40px;
    height:40px;
    font-size:21px;
  }

  .main,
  .rtl .main{
    padding:9px;
  }

  .top h1{
    font-size:19px;
  }

  .section{
    padding:11px;
  }

  .actions button{
    width:100%;
    flex:1 1 100%;
  }

  .msTop{
    grid-template-columns:55px 1fr;
  }

  .msSchool h1{
    font-size:16px;

function roleAllowed(p){
 const u=currentUser();
 if(!u||u.role==='Administrator'||u.type==='admin')return true;
 const adminOnly=['admin','formBuilder','settings','backup'];
 if(adminOnly.includes(p))return false;
 const defaults={Accountant:['dashboard','fees','salary','accounting','reports','mIncome','mRaseed','mBoxes'],Teacher:['dashboard','academic','subjects','assignments','shifts','timetable','attendance','teacherAttendance','attendanceSummary','results','reports','mLibrary','mHostel'],Receptionist:['dashboard','students','admission','classes','rollManagement','fees','reports','mLibrary','mHostel']};
 const saved=get(keys.permissions,{}), custom=saved[String(u.employee||'')];
 if(custom&&typeof custom==='object')return custom[p]===true;
 return (defaults[u.role]||[]).includes(p);
}

function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function getRules(){const d=get(keys.documentRules,{});return d}
function docField(key,label,required=false){return `<div class="field"><label>${esc(label)}${required?' *':''}</label><input name="${esc(key)}" type="file" accept=".pdf,image/*" ${required?'required':''}></div>`}
function customField(f){if(f.type==='textarea')return `<div class="field" style="grid-column:1/-1"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${esc(f.key)}" ${f.required?'required':''}></textarea></div>`;if(f.type==='select')return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><select name="${esc(f.key)}" ${f.required?'required':''}><option value="">${t('select')}</option>${String(f.options||'').split('|').filter(Boolean).map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input name="${esc(f.key)}" type="${esc(f.type||'text')}" ${f.required?'required':''}></div>`}
function classOptions(sel=''){const classes=get(keys.classes,[]);const names=[...new Set(classes.map(v=>String(v.name||'').trim()).filter(Boolean))];return '<option value="">Select Class</option>'+names.map(v=>`<option value="${esc(v)}" ${String(v)===String(sel||'')?'selected':''}>${esc(v)}</option>`).join('')}
function sectionOptions(className='',sel=''){const rows=get(keys.classes,[]).filter(v=>!className||String(v.name||'')===String(className));const names=[...new Set(rows.map(v=>String(v.section||'').trim()).filter(Boolean))];return '<option value="">Select Section</option>'+names.map(v=>`<option value="${esc(v)}" ${String(v)===String(sel||'')?'selected':''}>${esc(v)}</option>`).join('')}
function admission(c){const d=getRules(),fs=get(keys.formFields,[]).filter(f=>f.area==='student'&&f.enabled!==false);c.innerHTML=`<div class="section"><div class="toolbar"><h2>${t('admission')}</h2><span class="mini">Documents can be Mandatory or Optional from Form Builder.</span></div><form id="admissionForm" onsubmit="saveStudent(event)"><div class="grid"><div class="field"><label>${t('admissionNo')} *</label><input name="admissionNo" required></div><div class="field"><label>${t('studentName')} *</label><input name="name" required></div><div class="field"><label>${t('father')}</label><input name="father"></div><div class="field"><label>${t('mother')}</label><input name="mother"></div><div class="field"><label>${t('guardian')}</label><input name="guardian"></div><div class="field"><label>${t('gender')}</label><select name="gender"><option value="">${t('select')}</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>${t('class')}</label><select id="admissionClass" name="class" onchange="updateAdmissionSections()">${classOptions()}</select></div><div class="field"><label>${t('section')}</label><select id="admissionSection" name="section"><option value="">Select Section</option></select></div><div class="field"><label>${t('roll')}</label><input name="roll" inputmode="numeric"></div><div class="field"><label>${t('dob')}</label><input name="dob" type="date"></div><div class="field"><label>${t('contact')}</label><input name="phone" type="tel"></div><div class="field"><label>${t('blood')}</label><input name="blood"></div><div class="field" style="grid-column:1/-1"><label>${t('address')}</label><textarea name="address"></textarea></div>${d.studentAadhaar!==false?docField('aadhaar','Aadhaar Card',!!d.studentAadhaarRequired):''}${d.studentBirth!==false?docField('birthCertificate','Birth Certificate',!!d.studentBirthRequired):''}${d.studentOther!==false?docField('otherDocuments','Other Documents',!!d.studentOtherRequired):''}${fs.map(customField).join('')}</div><div class="actions"><button type="submit" class="primary">${t('addStudent')}</button><button type="button" class="secondary" onclick="resetAdmissionForm()">Clear</button></div></form></div>`;updateAdmissionSections()}
function updateAdmissionSections(){const cls=document.getElementById('admissionClass'),sec=document.getElementById('admissionSection');if(!cls||!sec)return;const old=sec.value;sec.innerHTML=sectionOptions(cls.value,old)}
function resetAdmissionForm(){const f=document.getElementById('admissionForm');if(f){f.reset();updateAdmissionSections()}}
async function saveStudent(e){e.preventDefault();const form=e.target,btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.textContent='Saving...'}try{const fd=new FormData(form),x={};for(const [k,v] of fd.entries()){if(v instanceof File){if(v.size)x[k]=await fileToData(v)}else x[k]=String(v??'').trim()}x.admissionNo=String(x.admissionNo||'').trim();x.name=String(x.name||'').trim();if(!x.admissionNo||!x.name)throw new Error('Admission No and Student Name are required.');const a=get(keys.students,[]);if(a.some(v=>String(v.admissionNo||'').trim().toLowerCase()===x.admissionNo.toLowerCase()))throw new Error('Admission No already exists.');x.status='Active';x.createdAt=new Date().toISOString();a.push(x);put(keys.students,a);toast('Student saved successfully');go('students')}catch(err){console.error('ADMISSION SAVE ERROR:',err);alert('Admission save failed: '+(err?.message||'Please try again.'))}finally{if(btn){btn.disabled=false;btn.textContent=t('addStudent')}}}
function students(c){const a=get(keys.students,[]);c.innerHTML=`<div class="section"><div class="toolbar"><h2>${t('students')}</h2><div><input class="search" id="studentSearch" placeholder="${t('search')}" oninput="filterStudents()"> <button class="secondary" onclick="studentImportModal()">📥 Import Excel</button> <button class="primary" onclick="go('admission')">+ ${t('addStudent')}</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('admissionNo')}</th><th>${t('studentName')}</th><th>${t('father')}</th><th>${t('class')}</th><th>${t('section')}</th><th>${t('roll')}</th><th>${t('contact')}</th><th>${t('status')}</th><th></th></tr></thead><tbody id="studentBody">${studentRows(a)}</tbody></table></div></div>`}
function studentRows(a){return a.map((x,i)=>`<tr><td>${esc(x.admissionNo)}</td><td>${esc(x.name)}</td><td>${esc(x.father)}</td><td>${esc(x.class)}</td><td>${esc(x.section)}</td><td>${esc(x.roll)}</td><td>${esc(x.phone||x.contact)}</td><td><span class="badge ${x.status==='Inactive'?'inactiveBadge':'activeBadge'}">${esc(x.status||'Active')}</span></td><td><button class="secondary" onclick="editStudent(${get(keys.students,[]).findIndex(v=>String(v.admissionNo)===String(x.admissionNo))}">${t('edit')}</button> <button class="secondary" onclick="admissionPrintModalByAdm('${esc(x.admissionNo).replace(/'/g,"\\'")}')">🖨️ Print</button> <button class="danger" onclick="deleteStudent(${get(keys.students,[]).findIndex(v=>String(v.admissionNo)===String(x.admissionNo))}")">${t('delete')}</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">${t('noStudents')}</td></tr>`}
function admissionPrintModalByAdm(adm){const i=get(keys.students,[]).findIndex(x=>String(x.admissionNo)===String(adm));if(i>=0)admissionPrintModal(i)}
function results(c){const marks=get(keys.marks,[]),groups={};marks.forEach(x=>{const k=String(x.exam||'')+'||'+String(x.admissionNo||x.studentName||'');if(!groups[k])groups[k]={exam:x.exam||'',admissionNo:x.admissionNo||'',studentName:x.studentName||'',rows:[]};groups[k].rows.push(x)});const arr=Object.values(groups).reverse();c.innerHTML=`<div class="section"><div class="toolbar"><h2>${t('results')}</h2><button class="primary" onclick="resultModal()">+ ${t('add')}</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Exam</th><th>${t('studentName')}</th><th>Subjects</th><th>Total</th><th>Obtained</th><th>%</th><th>Grade</th><th>Status</th><th>Print</th></tr></thead><tbody>${arr.map(g=>{const total=g.rows.reduce((a,x)=>a+Number(x.max||0),0),obt=g.rows.reduce((a,x)=>a+Number(x.marks||0),0),pct=total?obt/total*100:0,grade=pct>=90?'A+':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';return `<tr><td>${esc(g.exam)}</td><td>${esc(g.studentName)}</td><td>${g.rows.length}</td><td>${total}</td><td>${obt}</td><td>${pct.toFixed(1)}%</td><td>${grade}</td><td><span class="badge ${grade==='F'?'inactiveBadge':'activeBadge'}">${grade==='F'?'Fail':'Pass'}</span></td><td><button class="secondary" onclick="marksheetPrintModal('${esc(g.exam).replace(/'/g,"\\'")}','${esc(g.admissionNo).replace(/'/g,"\\'")}')">🖨️ ${t('print')}</button></td></tr>`}).join('')||`<tr><td colspan="9" class="empty">No result records found.</td></tr>`}</tbody></table></div></div>`}
function marksheetPrintModal(exam,adm){window.__msPrintArgs={exam,adm};modal(`<div class="modalHead noPrint"><h2>Marksheet Print</h2><div>${printLangSelect('msPrintLang','en')} <button class="primary" onclick="printMarksheet(window.__msPrintArgs.exam,window.__msPrintArgs.adm,document.getElementById('msPrintLang').value)">🖨️ Print</button><button class="close" onclick="closeModal()">×</button></div></div><div class="noPrint" style="padding:12px;text-align:center">Select English, Hindi or Urdu, then click Print.</div>`)}
function studentImportModal(){modal(`<div class="modalHead"><h2>Import Students from Excel</h2><button class="close" onclick="closeModal()">×</button></div><div class="importBox"><div class="importHelp"><b>Excel columns supported:</b> Admission No, Student Name/Name, Father Name, Mother Name, Guardian Name, Gender, Class, Section, Roll No, DOB/Date of Birth, Phone/Contact, Blood Group, Address, Status.<br><br><b>Section-wise import:</b> Excel me Class aur Section columns rakho, ya neeche Class/Section select karke poori file ko us class/section me import karo. Duplicate Admission No automatically skip honge.</div><div class="grid" style="margin-top:14px"><div class="field"><label>Excel File (.xlsx/.xls) *</label><input id="studentExcelFile" type="file" accept=".xlsx,.xls" required></div><div class="field"><label>Target Class (optional)</label><select id="importClass" onchange="updateImportSections()">${classOptions()}</select></div><div class="field"><label>Target Section (optional)</label><select id="importSection"><option value="">Select Section</option></select></div></div><div id="importResult" class="mini" style="margin-top:10px"></div><div class="actions"><button class="primary" onclick="importStudentsFromExcel()">📥 Import Students</button><button class="secondary" onclick="closeModal()">${t('cancel')}</button></div></div>`)}
function updateImportSections(){const cls=document.getElementById('importClass'),sec=document.getElementById('importSection');if(!cls||!sec)return;sec.innerHTML=sectionOptions(cls.value,'')}
async function importStudentsFromExcel(){const input=document.getElementById('studentExcelFile'),result=document.getElementById('importResult');if(!input?.files?.[0])return alert('Please select an Excel file.');if(!window.tvgs?.parseExcel)return alert('Excel import service is unavailable. Please restart the application.');try{result.textContent='Reading Excel...';const rows=await window.tvgs.parseExcel(input.files[0]);if(!Array.isArray(rows)||!rows.length)throw new Error('No data rows found in Excel.');const targetClass=document.getElementById('importClass')?.value||'',targetSection=document.getElementById('importSection')?.value||'';const a=get(keys.students,[]),existing=new Set(a.map(x=>String(x.admissionNo||'').trim().toLowerCase()).filter(Boolean));const norm=v=>String(v??'').trim();const pick=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k).toLowerCase()===n);if(k!=null&&norm(r[k])!=='')return norm(r[k])}return ''};let added=0,skipped=0,bad=0;for(const r of rows){const x={admissionNo:pick(r,['admission no','admission number','admissionno','adm no','form no','form number']),name:pick(r,['student name','name']),father:pick(r,['father name','father']),mother:pick(r,['mother name','mother']),guardian:pick(r,['guardian name','guardian']),gender:pick(r,['gender','sex']),class:targetClass||pick(r,['class','class name','classname']),section:targetSection||pick(r,['section','section name','sectionname']),roll:pick(r,['roll no','roll number','roll','rollno']),dob:pick(r,['dob','date of birth','birth date']),phone:pick(r,['phone','phone no','mobile','mobile no','contact','contact no']),blood:pick(r,['blood group','blood']),address:pick(r,['address']),status:pick(r,['status'])||'Active'};if(!x.admissionNo||!x.name){bad++;continue}const key=x.admissionNo.toLowerCase();if(existing.has(key)){skipped++;continue}existing.add(key);x.createdAt=new Date().toISOString();a.push(x);added++}put(keys.students,a);result.textContent=`Import complete — Added: ${added}, Skipped duplicates: ${skipped}, Invalid rows: ${bad}`;toast(`${added} students imported`);students(document.getElementById('content'));setTimeout(closeModal,900)}catch(err){console.error('EXCEL IMPORT ERROR:',err);result.textContent='Import failed: '+(err?.message||'Unknown error');alert('Excel import failed: '+(err?.message||'Please check the file.'))}}

function rollManagement(c){
 const students=get(keys.students,[]), classes=[...new Set(students.map(s=>s.class).filter(Boolean))], cls=document.getElementById('rollClass')?.value||'', sec=document.getElementById('rollSection')?.value||'';
 const filtered=students.filter(s=>(!cls||s.class===cls)&&(!sec||String(s.section||'')===sec));
 const sections=[...new Set(students.filter(s=>!cls||s.class===cls).map(s=>s.section).filter(Boolean))];
 c.innerHTML=`<div class="section"><div class="toolbar"><h2>Roll Management</h2><div><select class="search" id="rollClass" onchange="render()"><option value="">All Classes</option>${classes.map(v=>`<option ${v===cls?'selected':''}>${esc(v)}</option>`).join('')}</select><select class="search" id="rollSection" onchange="render()"><option value="">All Sections</option>${sections.map(v=>`<option ${v===sec?'selected':''}>${esc(v)}</option>`).join('')}</select><button class="primary" onclick="autoAssignRolls()">Auto Assign Rolls</button></div></div><div class="mini" style="margin-bottom:12px">Roll numbers are maintained class/section-wise. Auto Assign gives sequential rolls starting from 1.</div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Admission No</th><th>Student Name</th><th>Class</th><th>Section</th><th>Roll No</th><th></th></tr></thead><tbody>${filtered.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.admissionNo)}</td><td>${esc(s.name)}</td><td>${esc(s.class||'')}</td><td>${esc(s.section||'')}</td><td><input style="width:100px" value="${esc(s.roll||'')}" onchange="setStudentRoll('${esc(s.admissionNo)}',this.value)"></td><td><span class="mini">Auto-save</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No students found.</td></tr>'}</tbody></table></div></div>`;
}
function setStudentRoll(adm,val){const a=get(keys.students,[]),s=a.find(x=>x.admissionNo===adm);if(!s)return;s.roll=String(val||'').trim();put(keys.students,a);toast('Roll number saved');render()}
function autoAssignRolls(){const cls=document.getElementById('rollClass')?.value||'',sec=document.getElementById('rollSection')?.value||'';if(!cls)return alert('Please select a class first.');const a=get(keys.students,[]).filter(s=>s.status!=='Inactive'&&s.class===cls&&(!sec||String(s.section||'')===sec)).sort((x,y)=>String(x.name||'').localeCompare(String(y.name||'')));const all=get(keys.students,[]);a.forEach((s,i)=>{const z=all.find(x=>x.admissionNo===s.admissionNo);if(z)z.roll=String(i+1)});put(keys.students,all);toast('Roll numbers assigned successfully');render()}
function subjects(c){const a=get(keys.subjects,[]),classes=get(keys.classes,[]);c.innerHTML=`<div class="section"><div class="toolbar"><h2>${t('subjects')}</h2><button class="primary" onclick="addSubjectModal()">+ ${t('addSubject')}</button></div><div class="tablewrap"><table class="table"><thead><tr><th>${t('subjectName')}</th><th>${t('class')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.className||'All Classes')}</td><td><span class="badge ${x.status==='Inactive'?'inactiveBadge':'activeBadge'}">${esc(x.status||'Active')}</span></td><td><button class="secondary" onclick="editSubject(${i})">${t('edit')}</button> <button class="danger" onclick="deleteSubject(${i})">${t('delete')}</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">${t('noSubjects')}</td></tr>`}</tbody></table></div></div>`}
function addSubjectModal(){const classes=get(keys.classes,[]);modal(`<div class="modalHead"><h2>${t('addSubject')}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSubject(event)"><div class="grid"><div class="field"><label>${t('subjectName')} *</label><input name="name" required></div><div class="field"><label>${t('class')}</label><select name="className"><option value="">All Classes</option>${classes.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>${t('status')}</label><select name="status"><option>Active</option><option>Inactive</option></select></div></div><div class="actions"><button class="primary">${t('save')}</button><button type="button" class="secondary" onclick="closeModal()">${t('cancel')}</button></div></form>`)}
function saveSubject(e){e.preventDefault();const x=Object.fromEntries(new FormData(e.target).entries()),a=get(keys.subjects,[]);if(a.some(v=>String(v.name).trim().toLowerCase()===String(x.name).trim().toLowerCase()&&String(v.className||'')===String(x.className||'')))return alert('Subject already exists.');a.push({...x,createdAt:new Date().toISOString()});put(keys.subjects,a);closeModal();toast();render()}
function editSubject(i){const a=get(keys.subjects,[]),x=a[i],classes=get(keys.classes,[]);modal(`<div class="modalHead"><h2>${t('edit')} ${t('subjects')}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="updateSubject(event,${i})"><div class="grid"><div class="field"><label>${t('subjectName')} *</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>${t('class')}</label><select name="className"><option value="">All Classes</option>${classes.map(v=>`<option ${v.name===x.className?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label>${t('status')}</label><select name="status"><option ${x.status!=='Inactive'?'selected':''}>Active</option><option ${x.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div class="actions"><button class="primary">${t('save')}</button><button type="button" class="secondary" onclick="closeModal()">${t('cancel')}</button></div></form>`)}

function saveTimetable(e,i){e.preventDefault();const a=get(keys.timetable,[]),x=Object.fromEntries(new FormData(e.target).entries());
 const same=a.filter((v,j)=>j!==i&&v.day===x.day&&v.periodId===x.periodId&&v.shiftId===x.shiftId);
 if(same.some(v=>v.className===x.className&&(v.section||'')===(x.section||'')))return alert('Conflict: this class/section already has a timetable entry in this period.');
 if(same.some(v=>v.teacherId===x.teacherId))return alert('Conflict: this teacher is already assigned in this period.');
 if(x.room&&same.some(v=>v.room&&v.room.trim().toLowerCase()===x.room.trim().toLowerCase()))return alert('Conflict: this room is already occupied in this period.');
 const as=assignmentFor(x.className,x.section,x.subjectId); if(get(keys.subjectAssignments,[]).length&& !as)return alert('Please create a Subject–Class–Teacher assignment first.');
 if(as && as.teacherId!==x.teacherId)return alert('Selected teacher does not match the master subject assignment.');
 if(i<0)a.push({...x,id:'TT-'+Date.now(),session:get(keys.school,{}).session||''});else a[i]={...a[i],...x};put(keys.timetable,a);closeModal();toast();render()}

async function importStaffFromExcel(){const input=document.getElementById('staffExcelFile'),result=document.getElementById('staffImportResult');if(!input?.files?.[0])return alert('Please select an Excel file.');if(!window.tvgs?.parseExcel)return alert('Excel import service is unavailable. Please restart the application.');try{result.textContent='Reading Excel...';const rows=await window.tvgs.parseExcel(input.files[0]);const a=get(keys.staff,[]),existing=new Set(a.map(x=>String(x.employee||'').trim().toLowerCase()).filter(Boolean));const norm=v=>String(v??'').trim();const pick=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k).toLowerCase()===n);if(k!=null&&norm(r[k])!=='')return norm(r[k])}return ''};let added=0,skipped=0,bad=0;for(const r of rows){const x={employee:pick(r,['employee id','employee','employee no','employee number','emp id','emp no']),name:pick(r,['staff name','name','teacher name']),designation:pick(r,['designation','post']),subject:pick(r,['subject']),qualification:pick(r,['qualification']),joining:pick(r,['joining date','joining','date of joining']),salary:pick(r,['salary','salary amount','basic salary']),phone:pick(r,['phone','phone no','mobile','mobile no','contact','contact no']),loginId:pick(r,['login id','username','user name']),status:pick(r,['status'])||'Active'};if(!x.employee||!x.name){bad++;continue}const key=x.employee.toLowerCase();if(existing.has(key)){skipped++;continue}existing.add(key);x.salary=Number(x.salary||0);x.createdAt=new Date().toISOString();a.push(x);added++}put(keys.staff,a);result.textContent=`Import complete — Added: ${added}, Skipped duplicates: ${skipped}, Invalid rows: ${bad}`;toast(`${added} staff imported`);staff(document.getElementById('content'));setTimeout(closeModal,1100)}catch(err){console.error('STAFF EXCEL IMPORT ERROR:',err);result.textContent='Import failed: '+(err?.message||'Unknown error');alert('Staff Excel import failed: '+(err?.message||'Please check the file.'))}}

function accounting(c){

 const salaryExp=salary.filter(x=>String(x.date||x.paymentDate||'').startsWith(month)).reduce((n,x)=>n+Number(x.net||x.netSalary||0),0);
 const otherExp=exp.filter(x=>String(x.date||'').startsWith(month)).reduce((n,x)=>n+Number(x.amount||0),0);

 const mIncome=feeIncome+otherIncome,mExpense=salaryExp+otherExp,yIncome=yearFee+yearOtherInc,yExpense=yearSalary+yearOtherExp;

 <div class="cards"><div class="card"><div class="muted">Monthly Income</div><div class="stat money">₹${money(mIncome)}</div><div class="mini">Fees ₹${money(feeIncome)} + Other ₹${money(otherIncome)}</div></div><div class="card"><div class="muted">Monthly Expenses</div><div class="stat money">₹${money(mExpense)}</div><div class="mini">Salary ₹${money(salaryExp)} + Other ₹${money(otherExp)}</div></div><div class="card"><div class="muted">Monthly Net</div><div class="stat money">₹${money(mIncome-mExpense)}</div></div><div class="card"><div class="muted">Yearly Net (${year})</div><div class="stat money">₹${money(yIncome-yExpense)}</div><div class="mini">Income ₹${money(yIncome)} | Expense ₹${money(yExpense)}</div></div></div></div>

async function importAccountingFromExcel(){const input=document.getElementById('accountExcelFile'),result=document.getElementById('accountImportResult'),type=document.getElementById('accountImportType')?.value||'income';if(!input?.files?.[0])return alert('Please select an Excel file.');if(!window.tvgs?.parseExcel)return alert('Excel import service is unavailable. Please restart the application.');try{result.textContent='Reading Excel...';const rows=await window.tvgs.parseExcel(input.files[0]);const key=type==='income'?keys.accountingIncome:keys.accountingExpenses;const a=get(key,[]),norm=v=>String(v??'').trim(),pick=(r,names)=>{for(const n of names){const k=Object.keys(r).find(k=>norm(k).toLowerCase()===n);if(k!=null&&norm(r[k])!=='')return norm(r[k])}return ''};const sig=v=>[v.date,v.category,v.description,Number(v.amount||0)].join('|').toLowerCase();const existing=new Set(a.map(sig));let added=0,skipped=0,bad=0;for(const r of rows){const x={date:pick(r,['date','entry date','payment date']),category:pick(r,['category','type']),description:pick(r,['description','details','particulars']),amount:Number(pick(r,['amount','value','total'])||0)};if(!x.date||!x.category||!x.amount){bad++;continue}const k=sig(x);if(existing.has(k)){skipped++;continue}existing.add(k);x.id=(type==='income'?'INC-':'EXP-')+Date.now()+'-'+added;a.push(x);added++}put(key,a);result.textContent=`Import complete — Added: ${added}, Skipped duplicates: ${skipped}, Invalid rows: ${bad}`;toast(`${added} accounting entries imported`);accounting(document.getElementById('content'));setTimeout(closeModal,1100)}catch(err){console.error('ACCOUNTING EXCEL IMPORT ERROR:',err);result.textContent='Import failed: '+(err?.message||'Unknown error');alert('Accounting Excel import failed: '+(err?.message||'Please check the file.'))}}

function changeOwnPassword(e){
 e.preventDefault();
 const u=currentUser(),f=new FormData(e.target),cur=String(f.get('current')||''),next=String(f.get('next')||''),confirmPwd=String(f.get('confirm')||'');
 if(next.length<6)return alert('New password must be at least 6 characters.');
 if(next!==confirmPwd)return alert('New passwords do not match.');
 const nh=hashPassword(next);
 if(u.type==='admin'||u.role==='Administrator'){
   const a=get(keys.auth,null);if(!a||!verifyPassword(a.passwordHash,cur))return alert('Current password is incorrect.');
   a.passwordHash=nh;a.updatedAt=new Date().toISOString();put(keys.auth,a);
 }else{
   const a=get(keys.staff,[]),i=a.findIndex(x=>String(x.employee)===String(u.employee));
   if(i<0)return alert('Staff account not found.');
   if(!verifyPassword(a[i].loginPasswordHash,cur))return alert('Current password is incorrect.');
   a[i].loginPasswordHash=nh;put(keys.staff,a);
 }
 closeModal();toast('Password changed successfully');
}
function resetStaffPassword(i){

}
function saveResetStaffPassword(e,i){
 e.preventDefault();
 const u=currentUser();if(!(u?.type==='admin'||u?.role==='Administrator'))return alert('Only Administrator can reset staff passwords.');
 const f=new FormData(e.target),next=String(f.get('next')||''),confirmPwd=String(f.get('confirm')||'');
 if(next.length<6)return alert('Password must be at least 6 characters.');
 if(next!==confirmPwd)return alert('Passwords do not match.');

function printMarksheet(exam,admissionNo,langChoice=printLanguage){printLanguage=langChoice;const all=get(keys.marks,[]),rows=all.filter(x=>String(x.exam||'')===String(exam||'') && String(x.admissionNo||'')===String(admissionNo||''));const fallback=all.filter(x=>String(x.exam||'')===String(exam||'') && String(x.studentName||'')===String(rows[0]?.studentName||''));const data=rows.length?rows:fallback;if(!data.length){toast('No marks found');return}const s=get(keys.students,[]).find(v=>String(v.admissionNo||'')===String(data[0].admissionNo||''))||{};const sc=get(keys.school,{});const total=data.reduce((a,x)=>a+Number(x.max||0),0),obt=data.reduce((a,x)=>a+Number(x.marks||0),0),pct=total?obt/total*100:0,grade=pct>=90?'A+':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F',pass=grade!=='F',subjectRows=data.map(x=>{const q=Number(x.max)?Number(x.marks)/Number(x.max)*100:0,g=q>=90?'A+':q>=80?'A':q>=70?'B':q>=60?'C':q>=50?'D':'F';return `<tr><td>${esc(x.subject)}</td><td>${esc(x.max)}</td><td>${esc(x.marks)}</td><td>${q.toFixed(1)}%</td><td>${g}</td><td>${g==='F'?ptxt('fail',langChoice):ptxt('pass',langChoice)}</td></tr>`}).join('');const L=langChoice==='ur'?'ur':'en';modal(`<div class="modalHead noPrint"><h2>${ptxt('marksheet',L)}</h2><div style="display:flex;gap:8px;align-items:center">${printLangSelect('msPrintLang',L)}<button class="primary" onclick="printMarksheetDoc()">🖨️ ${t('print')}</button><button class="close" onclick="closeModal()">×</button></div></div><div id="marksheetPrintArea" class="marksheet" dir="${L==='ur'?'rtl':'ltr'}"><div class="msTop"><div class="msLogo">${sc.logo?`<img src="${esc(sc.logo)}">`:''}</div><div class="msSchool"><h1>${esc(sc.name||'Madrasa')}</h1><div>${esc(sc.address||'')}</div><div>${esc(sc.phone||'')} ${sc.email?' | '+esc(sc.email):''}</div><div class="msBoard">${esc(sc.board||'')}</div></div><div class="msTitle"><b>${ptxt('marksheet',L)}</b><span>${esc(exam)}</span></div></div><div class="msStudent"><div><b>${ptxt('student',L)}</b>< function backupPage(c){c.innerHTML=`<div class="section"><div class="toolbar"><div><h2>${t('backup')}</h2><p class="muted">Complete backup of students, staff, fees, salary, attendance, results, TC, accounting, settings and all other local data.</p></div><button class="primary" onclick="downloadBackup()">💾 Backup Now</button></div><div class="importBox"><b>Recommended:</b> Backup file ko Desktop, pen drive, external drive ya cloud storage me zaroor rakhein. Software uninstall hone ke baad isi file se data restore kiya ja sakta hai.<div id="backupStatus" class="importResult">Automatic backup: enabled</div></div></div><div class="section"><h2>${t('restoreData')}</h2><p class="muted">Restore a previously exported backup. Existing matching local data will be replaced.</p><div class="actions"><input id="restoreInput" type="file" accept="application/json,.json"><button class="primary" onclick="restoreBackup()">↩ Restore Backup</button></div></div>`;}
async function downloadBackup(){const u=currentUser();if(!(u?.type==='admin'||u?.role==='Administrator'))return alert('Only Administrator can create backups.');const data=collectBackupData();try{const r=window.tvgs?.saveBackup?await window.tvgs.saveBackup(data):{ok:false,error:'Backup service unavailable'};if(r?.ok){const st=document.getElementById('backupStatus');if(st)st.textContent='Backup saved: '+r.path;toast('Backup saved successfully');}else{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Travo_Vista_Group_School_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded');}}catch(e){alert('Backup failed: '+(e?.message||'Unknown error'));}}
async function autoBackupSilent(){try{if(!window.tvgs?.autoBackup)return;await window.tvgs.autoBackup(collectBackupData())}catch(e){console.warn('AUTO BACKUP:',e)}}
async function restoreBackup(){const u=currentUser();if(!(u?.type==='admin'||u?.role==='Administrator'))return alert('Only Administrator can restore backups.');try{let d=null;if(window.tvgs?.chooseRestoreBackup){d=await window.tvgs.chooseRestoreBackup()}else{const f=document.getElementById('restoreInput')?.files?.[0];if(!f)return alert('Please select a backup file.');d=JSON.parse(await f.text())}if(!d?.data)throw new Error('Invalid backup file.');if(!confirm('Restore this backup? Existing local data will be replaced where backup data exists.'))return;Object.entries(keys).forEach(([k,key])=>{if(Object.prototype.hasOwnProperty.call(d.data,k))put(key,d.data[k])});toast('Data restored successfully');render();}catch(e){alert('Restore failed: '+(e?.message||'Invalid backup file.'))}}

function hashPassword(v){if(window.tvgs&&typeof window.tvgs.hashPassword==='function')return window.tvgs.hashPassword(String(v));throw new Error('Secure password service is unavailable. Please restart the application.')}
function verifyPassword(stored,password){if(window.tvgs&&typeof window.tvgs.verifyPassword==='function')return !!window.tvgs.verifyPassword(String(password),String(stored||''));return hashPassword(password)===String(stored||'')}
function upgradeLegacyHash(stored,password){const raw=String(stored||'');return raw&&!raw.startsWith('pbkdf2$')?hashPassword(password):raw}

d</label><input name="password" type="password" required autocomplete="current-password"></div><label class="authRemember"><input type="checkbox" name="remember"> Remember Me</label><div id="authMsg" class="authError"></div><div class="actions"><button type="submit" class="primary" style="width:100%">Login</button></div></form><div class="authLinks"><button type="button" onclick="forgotPassword()">Forgot Password?</button><span></span></div><div class="authHint">Administrator and staff accounts are secured online for this organization.</div></div>`}

ight:7mm;bottom:7mm;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;align-items:end;font-size:9.5px}.footer img{max-width:30mm;max-height:13mm;object-fit:contain}.sig{display:inline-block;border-top:1px solid #555;margin-top:7mm;padding-top:1mm;min-width:28mm}.noPrint{display:none!important}@media print{.paper{width:auto;min-height:281mm;margin:0;border:1.5px solid #7b8794}.footer{position:absolute;bottom:7mm}}`;
  w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body dir="${dir}"><div class="paper">${html}</div></body></html>`);w.document.close();

function dashboard(c){
  legacyDashboard2(c);
  const mi=get(keys.mIncome,[]), ai=get(keys.accountingIncome,[]), ex=get(keys.accountingExpenses,[]), sal=get(keys.salary,[]), fees=get(keys.fees,[]);
  const months={};
  const add=(arr,type)=>arr.forEach(x=>{
    const d=String(x.date||x.paymentDate||'');
    const m=d.slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(m))return;
    if(!months[m])months[m]={income:0,expense:0};
    months[m][type]+=Number(x.amount||x.paid||x.totalPaid||x.net||x.netSalary||0);
  });
  add(mi,'income'); add(ai,'income'); add(fees,'income'); add(ex,'expense'); add(sal,'expense');
  const totalIncome=mi.reduce((n,x)=>n+Number(x.amount||0),0)+ai.reduce((n,x)=>n+Number(x.amount||0),0)+fees.reduce((n,x)=>n+Number(x.paid||x.totalPaid||x.amount||0),0);
  const totalExpense=ex.reduce((n,x)=>n+Number(x.amount||0),0)+sal.reduce((n,x)=>n+Number(x.net||x.netSalary||0),0);
  const sec=document.createElement('div'); sec.className='section'; sec.style.marginTop='15px';
  sec.innerHTML=`<div class="toolbar"><div><h2>💰 Income & Expense Overview</h2><div class="muted">Month-wise financial summary</div></div></div>
  <div class="cards"><div class="card"><div class="muted">Total Income So Far</div><div class="stat money">₹${money(totalIncome)}</div></div><div class="card"><div class="muted">Total Expenses So Far</div><div class="stat money">₹${money(totalExpense)}</div></div><div class="card"><div class="muted">Current Balance</div><div class="stat money">₹${money(totalIncome-totalExpense)}</div></div></div>
  <div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Balance</th></tr></thead><tbody>${Object.keys(months).sort().reverse().map(m=>{const v=months[m];return `<tr><td>${esc(m)}</td><td class="money">₹${money(v.income)}</td><td class="money">₹${money(v.expense)}</td><td class="money">₹${money(v.income-v.expense)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No dated financial records yet.</td></tr>'}</tbody></table></div>`;
  c.appendChild(sec);
}
